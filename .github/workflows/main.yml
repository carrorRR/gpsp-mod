name: Build gpSP Mod for Android (32-bit)  # Workflow 的名字

on:
  push:            # 当你把代码推送到 master 或 main 分支时触发
    branches: [ master, main ]
  workflow_dispatch: # 允许在 GitHub 网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest  # 在 Ubuntu 虚拟机环境中运行
    steps:
    - uses: actions/checkout@v4  # 第1步：将代码拉取到虚拟机

    - name: Setup Android NDK  # 第2步：下载并设置 Android NDK 编译工具
      run: |
        echo "Downloading Android NDK..."
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        echo "NDK_PATH=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV

    - name: Build with NDK  # 第3步：开始编译 32 位的 .so 文件
      run: |
        export PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        export AR=armv7a-linux-androideabi21-ar
        export CC=armv7a-linux-androideabi21-clang
        export CXX=armv7a-linux-androideabi21-clang++
        export LINK=$CXX
        make -f Makefile.libretro platform=android ARCH=arm
        cp gpsp_libretro.so gpsp_mod_libretro_android.so

    - name: Upload artifact  # 第4步：将编译好的文件上传，方便下载
      uses: actions/upload-artifact@v4
      with:
        name: gpsp-mod-android-32bit
        path: gpsp_mod_libretro_android.so
